name: Backtest histórico (Sentinel Signals)

# Roda o motor de backtest histórico (src/lib/backtestEngine.js, ver
# docs/claude/backtest-usage.md e docs/known-risks.md item 33) na
# infraestrutura do GitHub Actions — que alcança a Binance Spot
# (data-api.binance.vision), diferente das sessões do Claude Code (rede
# bloqueada lá, ver .claude/rules/pine-parity.md). Existe pra permitir rodar
# e comparar backtests direto pelo GitHub, sem precisar de Node local.
#
# NÃO precisa de nenhum secret: o backend é fake em memória
# (scripts/backtestEntities.js, nunca toca o Firestore de produção) e o
# Telegram fica em no-op (scripts/backtestTelegram.js) — só faz leitura
# pública na Binance e devolve um relatório como artifact, sem gravar nada
# no repo nem em produção.
#
# Disparo MANUAL (Actions → "Backtest histórico (Sentinel Signals)" → Run
# workflow).
on:
  workflow_dispatch:
    inputs:
      symbols:
        # Carteira de referência de 20 símbolos. Ampliar em ATIVOS (e não em
        # anos) é o que dá amostra sem misturar regimes de mercado
        # incompatíveis — ver docs/roadmap.md, Bloco 0. ONDOUSDT e DYDXUSDT
        # continuam aqui de propósito: ONDO foi o pior ativo da medição de
        # 12 meses, e removê-lo depois de ver isso seria escolher o resultado.
        # PAXGUSDT (ouro tokenizado) é o único com correlação baixa com BTC,
        # então é o que mais adiciona amostra independente de verdade.
        description: "Símbolos separados por vírgula (Binance Spot)"
        default: "BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,DOTUSDT,NEARUSDT,ARBUSDT,OPUSDT,AAVEUSDT,SUIUSDT,FETUSDT,PENDLEUSDT,ZROUSDT,ONDOUSDT,DYDXUSDT,PAXGUSDT"
        required: true
      from:
        description: "Início (YYYY-MM-DD ou ISO) — vazio = 6 meses atrás"
        default: ""
        required: false
      to:
        description: "Fim (YYYY-MM-DD ou ISO) — vazio = agora"
        default: ""
        required: false
      timeframes:
        description: "Timeframes a baixar, separados por vírgula"
        default: "1h,4h,1d,15m"
        required: true
      smc:
        description: "Símbolos com a cascata SMC 1h→5m ativa, separados por vírgula (vazio = nenhum) — independente de smc_confirm abaixo"
        default: ""
        required: false
      smc_confirm:
        description: "Símbolos com o gate extra SMC na cascata 4h/15m (mais rígida), separados por vírgula (vazio = nenhum) — independente de smc acima"
        default: ""
        required: false
      pine_config:
        description: 'Overrides do pineConfig em JSON, ex.: {"minScore":80} (vazio = defaults)'
        default: ""
        required: false
      no_costs:
        description: "Rodar SEM custos (taxa/slippage/funding) — reproduz os números pré-Fase-5, para o A/B de quanto o custo come"
        type: boolean
        default: false
        required: false
      fee_bps:
        description: "Taxa por lado em bps (vazio = 5, ou seja 0,05% taker USDⓈ-M VIP0 — confirmado em binance.com/en/fee/futureFee)"
        default: ""
        required: false
      slippage_bps:
        description: "Slippage por lado em bps (vazio = 1)"
        default: ""
        required: false
      funding_bps:
        description: "Funding por janela de 8h em bps (vazio = 1). Só é cobrado nas fronteiras 00/08/16 UTC que a posição atravessar"
        default: ""
        required: false
      min_trades:
        description: "Mínimo de operações para o relatório não ser marcado INCONCLUSIVO (vazio = 30)"
        default: ""
        required: false
      trial_label:
        description: "Rótulo desta tentativa (só gravado no JSON) — serve para você contar quantas configurações já testou"
        default: ""
        required: false

permissions:
  contents: read

concurrency:
  group: backtest-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    # 90 min não comportava janela longa: o run de 12 meses gastou 6,5 min de
    # download + 28 min de replay, então 4 anos projeta ~2,3 h. Janela longa é
    # o que dá amostra suficiente para o gate estatístico (docs/known-risks.md
    # item 44) — a 109 operações/ano, 12 meses nunca chegam nas ~300 que um
    # veredito exige. Teto do GitHub para repo público é 6 h; 350 min deixa
    # folga sem virar job infinito em caso de travamento.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Datas dinâmicas ficam num passo isolado — todo input do
      # workflow_dispatch passa por env: (nunca interpolado direto no corpo
      # do script), mesmo cuidado do golden-fixture.yml contra injeção.
      - name: Resolver intervalo de datas
        env:
          FROM_INPUT: ${{ inputs.from }}
          TO_INPUT: ${{ inputs.to }}
        run: |
          FROM="$FROM_INPUT"
          TO="$TO_INPUT"
          if [ -z "$FROM" ]; then FROM=$(date -u -d '-6 months' +%Y-%m-%dT00:00:00Z); fi
          if [ -z "$TO" ]; then TO=$(date -u +%Y-%m-%dT00:00:00Z); fi
          echo "FROM=$FROM" >> "$GITHUB_ENV"
          echo "TO=$TO" >> "$GITHUB_ENV"
          echo "Intervalo: $FROM -> $TO"

      - name: Baixar histórico real (Binance Spot)
        env:
          SYMBOLS: ${{ inputs.symbols }}
          TIMEFRAMES: ${{ inputs.timeframes }}
        run: |
          node scripts/fetch-backtest-data.mjs \
            --symbols "$SYMBOLS" \
            --from "$FROM" --to "$TO" \
            --timeframes "$TIMEFRAMES"

      - name: Escrever overrides do pineConfig (se houver)
        if: ${{ inputs.pine_config != '' }}
        env:
          PINE_CONFIG: ${{ inputs.pine_config }}
        run: echo "$PINE_CONFIG" > pine-config-overrides.json

      - name: Rodar o replay
        env:
          SYMBOLS: ${{ inputs.symbols }}
          SMC: ${{ inputs.smc }}
          SMC_CONFIRM: ${{ inputs.smc_confirm }}
          HAS_PINE_CONFIG: ${{ inputs.pine_config != '' }}
          NO_COSTS: ${{ inputs.no_costs }}
          FEE_BPS: ${{ inputs.fee_bps }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
          FUNDING_BPS: ${{ inputs.funding_bps }}
          MIN_TRADES: ${{ inputs.min_trades }}
          TRIAL_LABEL: ${{ inputs.trial_label }}
        run: |
          ARGS=(--symbols "$SYMBOLS" --from "$FROM" --to "$TO" --out backtest-report.json)
          if [ -n "$SMC" ]; then ARGS+=(--smc "$SMC"); fi
          if [ -n "$SMC_CONFIRM" ]; then ARGS+=(--smc-confirm "$SMC_CONFIRM"); fi
          if [ "$HAS_PINE_CONFIG" = "true" ]; then ARGS+=(--pine-config pine-config-overrides.json); fi
          # Custos (Fase 5, docs/known-risks.md item 44): ligados por padrão.
          # --no-costs existe para o A/B "quanto o custo comeu" e reproduz
          # exatamente os números de antes da Fase 5.
          if [ "$NO_COSTS" = "true" ]; then ARGS+=(--no-costs); fi
          if [ -n "$FEE_BPS" ]; then ARGS+=(--fee-bps "$FEE_BPS"); fi
          if [ -n "$SLIPPAGE_BPS" ]; then ARGS+=(--slippage-bps "$SLIPPAGE_BPS"); fi
          if [ -n "$FUNDING_BPS" ]; then ARGS+=(--funding-bps "$FUNDING_BPS"); fi
          if [ -n "$MIN_TRADES" ]; then ARGS+=(--min-trades "$MIN_TRADES"); fi
          if [ -n "$TRIAL_LABEL" ]; then ARGS+=(--trial-label "$TRIAL_LABEL"); fi
          npm run backtest -- "${ARGS[@]}"

      # Resumo direto no job (sem baixar o artifact) — omite a curva
      # completa de operações fechadas, só os agregados por cascata.
      - name: Publicar resumo
        if: always()
        run: |
          if [ -f backtest-report.json ]; then
            {
              echo "## Backtest — resumo (${FROM} → ${TO})"
              # O VEREDITO vem primeiro, antes de qualquer win rate: um
              # relatório com amostra insuficiente (ou IC cruzando zero)
              # produz números de aparência perfeitamente normal, e é aí que
              # uma decisão errada nasce. Ver docs/known-risks.md item 44.
              node -e "
                const r = JSON.parse(require('fs').readFileSync('backtest-report.json', 'utf-8'));
                const c = r.costs || {};
                if (c.conclusive === false) {
                  const motivo = c.inconclusiveReason === 'sample_too_small'
                    ? \`amostra pequena demais (\${c.countedTrades} operações, mínimo \${c.minTrades})\`
                    : c.inconclusiveReason === 'ci_straddles_zero'
                      ? \`o IC 95% da expectância cruza zero [\${(c.expectancyRCI95 || []).map((v) => v.toFixed(3)).join(', ')}]\`
                      : 'não há operações com R calculável';
                  console.log('> ### ⚠️ RESULTADO INCONCLUSIVO');
                  console.log('> **Não tire conclusão deste relatório.** Motivo: ' + motivo + '.');
                  console.log('> Win rate e profit factor abaixo são ruído nesta amostra.');
                } else {
                  console.log(\`> ### ✅ Amostra suficiente — \${c.countedTrades} operações, expectância líquida \${(c.netExpectancyR ?? 0).toFixed(3)}R\`);
                }
                console.log('');
              "
              echo '```json'
              node -e "
                const r = JSON.parse(require('fs').readFileSync('backtest-report.json', 'utf-8'));
                const strip = (s) => s && ({ ...s, curve: undefined });
                console.log(JSON.stringify({
                  range: r.range,
                  totalOps: r.totalOps,
                  stillOpenAtCutoff: r.stillOpenAtCutoff,
                  trialLabel: r.trialLabel,
                  // costs é a seção que decide (item 44): avgCostR comparável
                  // direto com netExpectancyR, e grossExpectancyR ao lado
                  // mostrando quanto do resultado era só ausência de custo.
                  costs: r.costs,
                  overall: strip(r.overall),
                  byCascade: Object.fromEntries(Object.entries(r.byCascade).map(([k, v]) => [k, strip(v)])),
                  smcDiagnostics: r.smcDiagnostics,
                }, null, 2));
              "
              echo '```'
            # tee, não `>>`: o summary é renderizado só na UI e não sai por
            # nenhuma API de logs, então redirecionar tudo para lá tirava o
            # resultado do alcance de quem lê o run programaticamente (uma
            # sessão do Claude Code, por exemplo). Com tee o mesmo texto vai
            # para os dois lugares.
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "## Backtest — falhou antes de gerar relatório" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Decomposição do resultado (scripts/analyze-backtest.mjs) — publicada
      # no job porque `overall.curve`, de onde ela sai, só existe no artifact
      # completo; sem isso, responder "de onde vem o prejuízo?" exigiria
      # baixar o zip. Não roda replay nenhum e não toca em parâmetro: é
      # leitura do relatório que acabou de ser gerado. Ver known-risks item 44.
      - name: Publicar diagnóstico
        if: always()
        run: |
          if [ -f backtest-report.json ]; then
            {
              echo "## Diagnóstico — de onde vem o resultado"
              echo '```'
              node scripts/analyze-backtest.mjs --report backtest-report.json
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload do relatório completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: backtest-report.json
          retention-days: 30
          if-no-files-found: warn
