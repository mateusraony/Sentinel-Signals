name: Coletor de contexto — datas dos eventos (Sentinel Signals)

# docs/known-risks.md item 285, addendum 9 — Fase 2 do Contexto de Mercado. Lê as datas oficiais
# de CPI, Payroll, PPI e PCE no FRED, junta com a lista fixa (FOMC só nela) e grava 2 arquivos
# pequenos na branch pública `context-data`: events.json (tipo, data/hora, situação) e status.json
# (quando checou, se o FRED respondeu, cobertura). Nada de chave, URL, mensagem de erro, valor de
# série ou volatilidade — travado por scripts/contextCollect.test.js e pelo tripwire de isolamento.
#
# NENHUM banco (não pode acordar o Neon), NENHUM Telegram, NENHUMA ordem. Sem `npm ci`: o script
# usa só módulos nativos do Node.
#
# Escrita: é o ÚNICO workflow de contexto com `contents: write`, e só dá push na branch
# `context-data` (cria na 1ª vez, sem --force). Disparo principal: cron-job.org (07h, 12h e 21h de
# Brasília, via workflow_dispatch — docs/claude/external-cron-setup.md). O `schedule` tem 1 entrada, uma reserva
# diária fora do minuto :00 (o GitHub atrasa os agendamentos sob carga e desliga `schedule` após 60 dias sem atividade no repositório).
# Modo "janela" (addendum 15/17): nas horas das divulgações dos EUA (12h-14h UTC = 09h-11h50 de Brasília, cobre o horário de
# verão e o de inverno). Nesse modo o coletor só trabalha se algum evento do BLS saiu há ≤ 4 h e ainda não tem o "Atual"; senão
# sai sem rede e sem gravar. Quem liga o modo: a entrada `mode` = "janela" (um job do cron-job.org, opcional) OU o gatilho
# `workflow_run`: o fim de cada "Scheduled scan" (que o cron-job.org dispara a cada ~15 min) serve de relógio. O `schedule` do GitHub NÃO serve
# de relógio da janela: em 06/11/2026 a janela agendada não disparou nenhuma vez em ~50 min e a reserva diária do próprio coletor
# chega ~7 h atrasada (docs/known-risks.md item 285, addendum 17). O filtro de hora (12h-14h UTC) fica no `if:` do job — fora dela o
# job nem começa (não gasta minuto). O valor do modo chega ao script SÓ por variável de ambiente (nunca dentro do texto do `run:`).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo da coleta (deixe em branco; \"janela\" é usado só pelo agendador externo)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "41 11 * * *"
  workflow_run:
    workflows: ["Scheduled scan"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: context-collect
  cancel-in-progress: false

jobs:
  collect:
    # No gatilho do fim do scan só segue se: o scan é deste repositório, veio do cron-job.org ou da reserva (nunca de PR/push) e
    # terminou entre 12h e 14h59 UTC. Os outros gatilhos (manual, reserva diária) não passam por este filtro.
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule')
      && (contains(github.event.workflow_run.updated_at, 'T12:') || contains(github.event.workflow_run.updated_at, 'T13:') || contains(github.event.workflow_run.updated_at, 'T14:')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Abrir a branch de dados
        # Existe: abre a última versão. Não existe (1ª vez): cria vazia, sem histórico do código.
        # `ls-remote --exit-code` devolve 2 quando a branch NÃO existe e outro código quando a consulta
        # em si falha (rede, permissão): só o 2 autoriza criar a branch. Antes qualquer erro virava
        # "branch não existe" e o push tentaria criar uma branch nova por cima de uma existente.
        run: |
          # O GitHub roda este passo com `bash -e`: sem desligar o errexit, o código 2 (branch ainda
          # inexistente, o caso da 1ª coleta) encerraria o passo antes de chegar na criação da branch.
          set -uo pipefail
          set +e
          git ls-remote --exit-code --heads origin context-data >/dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin context-data
            git worktree add data FETCH_HEAD
            git -C data checkout -q -B context-data
          elif [ "$rc" -eq 2 ]; then
            git worktree add --orphan -b context-data data
          else
            echo "::error::Não consegui consultar o repositório para saber se a branch context-data existe (código $rc). Rode de novo; nada foi alterado."
            exit 1
          fi

      - name: Coletar as datas
        # FRED_API_KEY e BLS_API_KEY vão só na URL da requisição; CONTEXT_CONTACT_EMAIL só no User-Agent.
        # BLS_API_KEY (opcional) alimenta o "Anterior" dos números oficiais; sem ela, ou se o BLS a recusar, a coleta usa a versão sem chave.
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          CONTEXT_CONTACT_EMAIL: ${{ secrets.CONTEXT_CONTACT_EMAIL }}
          COLLECT_MODE: ${{ github.event.inputs.mode || (github.event_name == 'workflow_run' && 'janela') || '' }}
        run: |
          set -o pipefail
          node scripts/context-collect.mjs --dir data | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar na branch context-data
        run: |
          set -euo pipefail
          cd data
          git add events.json status.json
          # A base própria do BLS (addendum 21) só existe depois da 1ª coleta com números; sem o arquivo, o `git add` falharia.
          if [ -e bls-base.json ]; then
            git add bls-base.json
          fi
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git -c user.name="sentinel-signals-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Coleta de contexto $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:refs/heads/context-data
