name: Shadow scan (Fase 1 — RF 1h condicionado ao 4h)

# Braço decisório do modo sombra prospectivo (docs/known-risks.md item 56
# "Modo sombra") — roda src/lib/scanner.js SEM modificação, com
# pineConfig.rf1hCondEnabled forçado a true (scripts/adminPineConfigShadow.js)
# e todo write redirecionado para coleções Firestore isoladas, prefixadas
# 'experimentalRf1hShadow' (scripts/adminEntitiesShadow.js) — nunca abre uma
# TradeOperation real, nunca notifica Telegram.
#
# Cadência de 30min (não hora em hora, não os ~5min do scan real) —
# reduzida de 15min pra 30min a pedido do usuário (docs/known-risks.md item
# 106/107: cota do Firestore estourando em produção, compartilhada com este
# workflow). Achado original de revisão (Codex, PR #129, P1):
# check15mConfirmation só examina o ÚLTIMO candle 15m fechado no instante da
# chamada (src/lib/scanner.js) — cadência horária amostra só 1 de cada 4
# fechamentos de 15m, cadência de 30min amostra 1 de cada 2 (ainda perde
# metade dos fechamentos intermediários, mas menos cego que hora em hora; um
# alinhamento que aparece e reverte no MESMO fechamento de 30min continua
# permanentemente invisível pro scan sombra, mesmo com a janela de retry de
# 4h — ela reavalia o sinal, não os candles 15m intermediários perdidos).
# ~48 passadas/dia (era ~96 em 15min) — reduz pela metade a fatia deste
# workflow no orçamento compartilhado do Firestore (Spark gratuito, ~50k
# leituras/20k escritas por dia, projeto inteiro, trading-engine.md/
# scanner.js PASSES_PER_DAY) já usada pela produção real. Se depois de
# alguns dias a tela "Logs" ainda mostrar aviso de quota perto do limite,
# apertar de volta pra hora em hora é reversível sem custo (só o `cron:`
# abaixo) — nenhum estado de produção pra desfazer.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-scan-shadow-rf1h
  cancel-in-progress: false

jobs:
  scan-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run scan:shadow
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
