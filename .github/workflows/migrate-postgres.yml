name: Migrar Firestore → Postgres (dados reais)

# Disparo manual só (Actions tab → "Migrar Firestore → Postgres (dados
# reais)" → "Run workflow"). Fecha o item 7 do runbook de cutover
# (docs/claude/postgres-cutover-runbook.md): a sessão remota do Claude Code
# não alcança nem o Firestore de produção com credencial real nem o Neon
# real (db/CLAUDE.md) — este workflow roda no runner do GitHub (rede
# irrestrita) com os dois secrets juntos.
#
# Roda scripts/migrate-and-verify-postgres.mjs — migra E verifica cada
# coleção contra o MESMO snapshot do Firestore (lido uma única vez), em vez
# de rodar migrate-firestore-to-postgres.mjs + verify-postgres-migration.mjs
# como dois processos separados. Achado real (Codex review, PR #334): dois
# processos separados cada um lê o Firestore DE NOVO — se o cron ao vivo
# escrever entre as duas leituras (ele roda a cada ~5min, e o "ensaio" abaixo
# roda de propósito com o cron ainda ativo), a verificação acusa divergência
# falsa mesmo com a migração correta. O script combinado elimina a corrida
# por construção. Falha o job (`exit 1` via forceExit) se achar qualquer
# divergência de verdade (contagem/checksum/duplicata de TradeOperation).
#
# Dois usos previstos, mesmo passo:
# 1. "Ensaio" (item 6 do runbook) — rodar isto ANTES do dia do cutover, fora
#    da janela de manutenção, só pra validar o script contra dado real pela
#    primeira vez. Não afeta produção: Firestore é só lido; o Postgres
#    escrito ainda não é lido por nada em produção até o cutover (item 2)
#    acontecer.
# 2. Migração final do dia do cutover (passo 2-3 do runbook) — rodar de novo
#    bem antes do deploy simultâneo, pra upsertar qualquer dado criado desde
#    o ensaio. Aqui o cron já está pausado (passo 1), então a corrida acima
#    nem se aplicaria — mas o script combinado funciona igual nos dois casos,
#    sem precisar de lógica condicional.
#
# Custo de leitura Firestore: paginado (nunca um único request gigante), mas
# a CONTAGEM de leituras cobrada é a mesma de ler a coleção inteira —
# systemLogs é limitado aos 2000 mais recentes de propósito
# (LIST_LIMIT_OVERRIDES em migrate-firestore-to-postgres.mjs) pra não repetir
# o incidente do item 152 addendum (backfill-rtdb.mjs esgotou a cota lendo
# systemLogs sem limite). As outras 9 entidades continuam migração
# exaustiva — rodar numa janela de baixo uso evita competir com o scan
# agendado pela mesma cota diária.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Checar secrets obrigatórios
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON não configurado (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL não configurado (Settings → Secrets and variables → Actions → New repository secret, nome exato DATABASE_URL, valor = connection string 'pooled' do Console Neon)."
            exit 1
          fi

      - name: Migrar e verificar dados reais (Firestore → Postgres, mesmo snapshot)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # set -o pipefail: sem isso, o shell (só -e, sem pipefail) avalia o
        # código de saída do ÚLTIMO comando do pipe (tee, que sempre sai 0) —
        # uma falha real de migrate-and-verify-postgres.mjs (ex.:
        # RESOURCE_EXHAUSTED do Firestore) ficava mascarada como job verde
        # (achado real, 2026-09-12: o script logou "FAILED" mas o job
        # reportou success — quase levou o cutover a prosseguir sem a
        # migração final ter de fato rodado).
        run: |
          set -o pipefail
          npm run migrate-verify-postgres | tee -a "$GITHUB_STEP_SUMMARY"
