name: Keep sentinel-signals-api warm

# O plano gratuito do Render hiberna o serviço web depois de ~15 min sem
# tráfego, e leva ~30-60s para "acordar" — mais tempo do que o TradingView
# espera antes de desistir da entrega do webhook (ver docs/known-risks.md,
# item 6). Este workflow só faz um ping público em /health para manter o
# serviço acordado. Sem segredos necessários.
#
# Disparos: (1) `schedule` a cada 10 min; (2) o fim de cada "Scheduled scan" (`workflow_run`), que o
# cron-job.org dispara a cada ~15 min. O `schedule` do GitHub NÃO basta sozinho: medido em 06/11/2026, os
# disparos chegaram com 4 a 8 HORAS de intervalo (03:04, 10:42 e 17:40 UTC) em vez de 10 min, o servidor
# hibernava e o painel, ao abrir, não conseguia carregar os dados do servidor ("Saúde indisponível"; só 1
# nova tentativa de 1 s, menos que os 30-60 s de acordar) — docs/known-risks.md item 6, addendum de 06/11.
# O filtro do `if:` vale só para o gatilho do scan: o scan é deste repositório e veio do cron-job.org ou da
# reserva (nunca de PR/push). Um ping a cada ~15 min ainda pode deixar o servidor dormir em intervalos
# curtos (o Render dorme com 15 min sem tráfego); por isso o guia do cron-job.org traz um job GET opcional de 10 min.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Scheduled scan"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event_name != 'workflow_run' || (
      github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 https://sentinel-signals-api.onrender.com/health
