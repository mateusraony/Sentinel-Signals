name: Diagnóstico — auditoria de saúde

# Responde "o que está falhando e ninguém viu?" (docs/known-risks.md 164/165):
# erros e avisos agrupados, operações presas, funil de entrada e o estado do
# episódio de cota. Leitura pura — não é o relógio de trading (scan.yml) nem a
# checagem retroativa (backfill.yml), e o job FALHA se o script escrever
# qualquer coisa no Firestore.
on:
  # ⏰ 04:40 UTC = 01:40 em Brasília. Este horário NÃO é arbitrário: é quando as
  # duas falhas reais de cota aconteceram (04/09 04:43 e 05/09 04:36 UTC). A
  # cota é diária e zera ~07:00 UTC, então 04:40 é ~21h30 dentro do ciclo — o
  # fim do dia de cota, onde o problema aparece. Rodar de manhã diria "tudo
  # bem" mesmo num dia em que a cota estourou de madrugada, que foi exatamente
  # como isso passou dois dias despercebido.
  #
  # Ressalva conhecida: o `schedule:` do GitHub Actions atrasa sob carga e é
  # desativado após ~60 dias sem push no repo (known-risks 12/18/134). Para um
  # diagnóstico diário isso é aceitável — um atraso de minutos não muda o
  # veredito, e o disparo manual continua disponível.
  schedule:
    - cron: "40 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: health-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # O script avisa no Telegram por conta própria, e SÓ quando acha algo —
      # um aviso diário de "está tudo bem" treina o hábito de ignorar o aviso.
      # Por isso os secrets do Telegram entram aqui.
      - name: Auditar saúde (read-only, teto de 570 documentos)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/health-audit.mjs | tee -a "$GITHUB_STEP_SUMMARY"
