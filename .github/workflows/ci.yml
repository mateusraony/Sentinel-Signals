name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancels a superseded run on the same branch/PR — unlike the scheduled
# workflows (scan.yml etc.), which queue instead of cancel, a CI run made
# obsolete by a newer push has no value finishing (docs/known-risks.md
# item 80, E-2).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Catraca do typecheck (docs/known-risks.md item 166). NÃO exige zero:
      # o projeto é JSX com checkJs best-effort e carrega um passivo conhecido
      # de 16 erros de atrito de tipagem. O que ela impede é o passivo CRESCER
      # — foi por não ter guarda nenhuma que ele voltou de 0 para 16 sem
      # ninguém ver. Um erro de sintaxe reprova sempre, mesmo baixando a
      # contagem (o tsc aborta e reporta menos do que existe).
      - run: npm run typecheck:ratchet

      # Best-effort Telegram alert when lint/test/build fails, so the user
      # finds out without having to check GitHub. Silently skipped if the
      # Telegram secrets aren't configured (same secrets scan.yml uses).
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification."
            exit 0
          fi
          MSG="⚠️ <b>CI falhou</b>%0A%0ARepositório: ${{ github.repository }}%0ARef: ${{ github.ref_name }}%0AVeja: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "text=${MSG}" || true
