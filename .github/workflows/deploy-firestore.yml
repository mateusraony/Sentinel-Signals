name: Deploy Firestore & RTDB rules

# Manual, on-demand publish of firestore.rules / firestore.indexes.json /
# database.rules.json to the real Firebase project. There's no automatic
# trigger on push — rules changes go live only when this workflow is run by
# hand (Actions tab → "Deploy Firestore & RTDB rules" → "Run workflow"),
# reusing the same FIREBASE_SERVICE_ACCOUNT_JSON secret already configured
# for the scheduled scan job. See docs/known-risks.md, items 5 and 152 (RTDB
# added as a read-only mirror for the dashboard's polling reads). NOTE: until
# the Realtime Database is actually created in the Console (Firebase Console
# → Realtime Database → create), this run may fail on the `database` target —
# create the RTDB instance first, then run this workflow once to publish
# database.rules.json.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Write service account credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/service-account.json"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy firestore.rules, firestore.indexes.json and database.rules.json
        run: npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,database --project sentinel-signals --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
