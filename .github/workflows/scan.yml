name: Scheduled scan

on:
  # Low-frequency fallback only — the primary 5-min cadence is driven by an
  # external dispatch calling workflow_dispatch directly (see
  # docs/claude/external-cron-setup.md and docs/known-risks.md item 18):
  # measured over 48h, this schedule: trigger alone averaged ~100min between
  # runs (worst case ~3h26) instead of the 5min configured here — GitHub's
  # documented schedule-queue drift under load, not a bug in this workflow.
  # Keeping this at */5 too (instead of hourly) would double real passes/day
  # once the external dispatch is reliable, silently pushing Firestore usage
  # past the PASSES_PER_DAY estimate in scanner.js — see that constant's
  # comment for the corresponding math.
  # Minute 7 (not :00) on purpose — GitHub's own docs flag the top of the hour
  # as the peak-load minute, where scheduled runs are most likely to be
  # delayed/dropped: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
  # Given the severe drift already measured on this repo (see comment above),
  # targeting the least reliable minute for the only remaining trigger would
  # be counterproductive.
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scheduled-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run scan
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}

      # DESLIGADO (2026-08-29, incidente ao vivo, docs/known-risks.md item 137
      # addendum) — um replay de 60 dias/15min contra o Firestore REAL (não o
      # fake em memória do backtest.yml) levou 11+min sem terminar e foi morto
      # pelo timeout do job, sem nunca gravar backfill_check_status — o ativo
      # ficou preso em 'pending' e CADA ciclo seguinte repetia o mesmo travamento,
      # atrasando o scan ao vivo de todo mundo (concurrency: scheduled-scan
      # serializa os runs; continue-on-error não protege contra estouro de
      # timeout, só contra exit code != 0). Religar exige: (1) rodar fora do
      # grupo de concorrência scheduled-scan (workflow separado), (2) resolver o
      # custo real de Firestore por tick antes de reabilitar dentro do cron ao
      # vivo, (3) restaurar MonitoredAsset/AssetState pós-replay (achado
      # separado, mesmo incidente — o replay também sobrescrevia o snapshot ao
      # vivo do ativo com dado histórico simulado enquanto rodava).
