services:
  - type: web
    runtime: static
    name: sentinel-signals
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyAjBZlR_r69qAkyPq2Ww0JBaY7F9HSdhpc
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: sentinel-signals.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: sentinel-signals
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: sentinel-signals.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "9439557541"
      - key: VITE_FIREBASE_APP_ID
        value: "1:9439557541:web:f92e49ade6d2e69f0dda4c"
      # RTDB read mirror for the dashboard's polling reads (docs/known-risks.md
      # item 152) — public URL, same class as the other VITE_FIREBASE_* values
      # above, not a secret. Empty until the Realtime Database is created in
      # the Firebase Console (Realtime Database → create) — the app falls
      # back to Firestore for everything while this is unset (see the guard
      # in src/lib/firebaseClient.js). Fill in after creating the RTDB
      # instance, format https://<project-id>-default-rtdb.<region>.firebasedatabase.app
      - key: VITE_FIREBASE_DATABASE_URL
        value: ""
      - key: VITE_BACKEND_URL
        value: https://sentinel-signals-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # sentinel-signals-api: real webhook receiver for the TradingView Pine
  # Script (POST /webhook/tradingview) — logs/notifies only, never places
  # orders (see docs/known-risks.md). Also hosts /api/telegram-notify
  # (unused by the browser today — Telegram is configured client-side, see
  # TelegramSettings.jsx — kept for when that changes) and /health.
  # Secrets below (sync: false) must be set manually in the Render
  # dashboard; they are never committed here.
  - type: web
    runtime: node
    name: sentinel-signals-api
    branch: main
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      # PAT fine-grained do GitHub, escopado SÓ a este repositório, com
      # permissão "Actions: Read and write" e nada mais — usado por
      # /api/backtest/{trigger,status,artifact} (server/index.js) para
      # disparar/ler o workflow backtest.yml pelo painel. Sem este secret,
      # essas rotas respondem 503 (ver o warning de boot em index.js).
      # ATENÇÃO: o GitHub não permite escopar um PAT a um único workflow —
      # "Actions: Read and write" vale para TODOS os workflows do repo. Se
      # este token vazar, dá pra disparar/ler qualquer workflow (backtest,
      # scan, backup, deploy-firestore), mas NÃO dá pra ler secrets, alterar
      # código (sem "Contents: write") nem promover admin. Risco aceito e
      # documentado, não uma falha de desenho — é o limite de granularidade
      # que a plataforma oferece.
      - key: GITHUB_ACTIONS_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://sentinel-signals.onrender.com
